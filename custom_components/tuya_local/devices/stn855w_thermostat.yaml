name: Thermostat
products:
  - id: paexrbfoogvpmzte
    manufacturer: ALRE
    model: STN855W-C

entities:
  # ── ENTIDAD PRINCIPAL: CLIMATE ────────────────────────────────
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 2
        type: string
        name: hvac_mode
        mapping:
          - dps_val: off
            value: "off"
          - dps_val: heat
            value: heat
          - dps_val: cold
            value: cool
          - dps_val: auto_heat
            value: heat_cool

      # Setpoint calor — DP 54 (Actúa como Dial Único Principal)
      - id: 54
        type: integer
        optional: true
        name: temperature
        mapping:
          - constraint: hvac_mode
            conditions:
              - dps_val: cold 
                value_redirect: cool_set_temp
            scale: 10
            step: 5
            range:
              min: 50
              max: 350

      # Setpoint frío — DP 57 (Espejo pasivo, no redirecciona de vuelta)
      - id: 57
        type: integer
        optional: true
        name: cool_set_temp
        mapping:
          - scale: 10
            step: 5
            range:
              min: 50
              max: 320

      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_cur_f
            scale: 10
            range:
              min: 0
              max: 800

      - id: 23
        type: string
        optional: true
        name: temperature_unit
        mapping:
          - dps_val: f
            value: F
          - value: C

      - id: 29
        type: integer
        optional: true
        name: temp_cur_f
        mapping:
          - scale: 10

      - id: 58
        type: string
        optional: true
        name: preset_mode
        mapping:
          - dps_val: manual
            value: manual
          - dps_val: program
            value: program
          - dps_val: temporary
            value: temporary

      - id: 64
        type: string
        optional: true
        name: fan_mode
        mapping:
          - dps_val: fan_auto
            value: auto
          - dps_val: fan_on
            value: "on"

      # Estado activo — muestra llama/copo sobre el ícono
      - id: 105
        type: string
        optional: true
        name: hvac_action
        mapping:
          - dps_val: "off"
            value: idle
          - dps_val: on1
            constraint: hvac_mode
            conditions:
              - dps_val: heat
                value: heating
              - dps_val: auto_heat
                value: heating
              - dps_val: cold
                value: cooling
            value: idle
          - dps_val: on2
            constraint: hvac_mode
            conditions:
              - dps_val: heat
                value: heating
              - dps_val: auto_heat
                value: heating
              - dps_val: cold
                value: cooling
            value: idle

  # ── MONITOREO DE RELÉS Y HARDWARE ─────────────────────────────
  - entity: sensor
    name: System Relay
    icon: "mdi:valve"
    class: enum            # <--- Agregado obligatorio para HA
    category: diagnostic
    dps:
      - id: 105
        type: string
        name: sensor
        mapping:
          - dps_val: off
            value: "off"
          - dps_val: on1
            value: stage_1
          - dps_val: on2
            value: stage_2


  - entity: sensor
    name: Fan Relay
    icon: "mdi:fan-clock"
    class: enum            # <--- Agregado obligatorio para HA
    category: diagnostic
    dps:
      - id: 106
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: off
            value: "off"
          - dps_val: on1
            value: low
          - dps_val: on2
            value: high


